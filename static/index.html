<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux | Vibe-to-Code Architect</title>
    <script>
        window.addEventListener('error', function (e) {
            console.error(e);
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(255,0,0,0.9);color:white;padding:10px;z-index:9999;font-family:monospace;font-size:12px;';
            errDiv.textContent = `JS Error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`;
            document.body.appendChild(errDiv);
        });
        window.addEventListener('unhandledrejection', function (e) {
            console.error(e);
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:30px;left:0;width:100%;background:rgba(255,100,0,0.9);color:white;padding:10px;z-index:9999;font-family:monospace;font-size:12px;';
            errDiv.textContent = `Promise Error: ${e.reason}`;
            document.body.appendChild(errDiv);
        });
    </script>


    <!-- Tailwind CSS (v3 via CDN for zero-build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Newsreader', 'Merriweather', 'serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/micro-interactions.css">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Mermaid.js (Visual Intelligence) -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', fontFamily: 'monospace' });
        window.mermaid = mermaid;
    </script>
</head>

<body class="bg-bg-main text-text-primary transition-colors duration-200 antialiased min-h-screen flex flex-col">

    <!-- App Container -->
    <div id="app" class="flex-grow flex flex-col">
        <!-- Views will be mounted here -->
    </div>

    <!-- Persistent HUD Container -->
    <div id="hud-container"></div>

    <!-- Global Project Context Banner -->
    <div id="project-banner"
        class="fixed top-0 left-0 right-0 h-1 bg-accent z-[101] transition-all duration-700 opacity-0 -translate-y-full">
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Script -->
    <script src="js/components/modal.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
